<link rel="manifest" href="manifest.webmanifest">
<!-- The version is in the FILENAME, never a query string: iOS drops an apple-touch-icon link
     whose href carries one, and the home screen falls back to a screenshot of the page. -->

<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167-v3.png">

<!-- THE CRASH TRAP IS THE FIRST THING IN THE HEAD, before the import map and before the
     module -- an error the trap is not installed for is an error nobody sees, and that
     includes a module that fails to PARSE and an import that never resolves. Registered
     with CAPTURE, because a failed subresource fires `error` at its own element. City lost
     six builds to a page that could not report its own exceptions. -->
<style>
  /* iOS SAFARI HAS IGNORED `user-scalable=no` SINCE iOS 10, so the viewport meta is not the
     fix and never was -- `touch-action` is. It is not inherited, but the browser intersects
     the values from the hit element up through its ancestors, so `none` on the root covers
     every descendant that does not override it. Double-tap zoom, pinch zoom and the 300 ms
     tap delay all go with it, and clicks still fire. */
  html,body{margin:0;height:100%;background:#14121c;overflow:hidden;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
    font-family:'Barlow Condensed',system-ui,-apple-system,sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #crash{position:fixed;inset:0;z-index:999;display:none;padding:18px;box-sizing:border-box;
    background:rgba(20,10,14,.96);color:#ffb4c4;font:12px/1.45 ui-monospace,Menlo,monospace;
    white-space:pre-wrap;overflow:auto;-webkit-user-select:text;user-select:text}
  #boot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:linear-gradient(170deg,#241c33 0%,#14121c 60%,#0d0b13 100%);
    color:#e8e4f2;transition:opacity .5s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot h1{margin:0;font-size:34px;letter-spacing:.06em;font-weight:800;color:#ff6fa5;
    text-shadow:0 3px 0 #6d2a49}
  #boot .msg{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
  #boot .bar{width:min(62vw,300px);height:4px;border-radius:2px;background:#ffffff22;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:0;background:#ff6fa5;transition:width .25s}
  #boot .bn{font-size:11px;letter-spacing:.2em;opacity:.45}
  /* FLOATING STICKS. The pad is a ZONE -- half the screen, invisible -- and the stick draws
     itself wherever the thumb lands. On a fixed 132 px circle every deflection is measured from
     the CIRCLE's centre, so a thumb that comes down near the rim reads as almost full travel
     before it has moved at all: the tap that should be a jump is instantly a camera drag. */
  .pad{position:fixed;bottom:0;width:50%;height:68%;touch-action:none;z-index:5}
  #stkL{left:0}
  #stkR{right:0}
  /* THE STICKS, STYLED (r43). *"More stylized -- they don't need to match weirdport, but a little more visible
     and cool."* Weirdport's shape, this game's colours: a COLOURED RIM with eight ticks, a SOLID knob with a dark
     ink edge, and a different hue per pad, because they are different controls (the body and the verb) and
     the thumb that lands on the wrong one should be told so. The old white-on-glass rings vanished on the pale
     floor; everything here carries a dark outline so it reads on the floor AND the sky. The knob is a skate
     WHEEL -- hub, bearing, tread. Nothing animates under a resting thumb; only the pop says a tap took. */
  .pad{--pc:#5fe1ff;--ink:#1b1033}
  #stkR{--pc:#ff6fa5}
  .ring,.knob{position:absolute;border-radius:50%;pointer-events:none;
    transform:translate(-50%,-50%);transition:opacity .13s}
  .ring{width:132px;height:132px;box-sizing:border-box;border:3px solid var(--pc);background:#1b103322;
    box-shadow:0 0 0 2px #1b103370, inset 0 0 0 2px #1b103340;opacity:.5}
  .ring::before{content:'';position:absolute;inset:7px;border-radius:50%;
    background:repeating-conic-gradient(from -3deg, var(--pc) 0 6deg, #0000 6deg 45deg);
    -webkit-mask:radial-gradient(closest-side,#0000 0 76%,#000 76%);mask:radial-gradient(closest-side,#0000 0 76%,#000 76%);opacity:.85}
  .knob{width:58px;height:58px;box-sizing:border-box;background:var(--pc);border:3px solid var(--ink);
    box-shadow:0 3px 0 #1b103399, inset 0 -4px 0 #1b103333, inset 0 3px 0 #ffffff55;opacity:.55}
  .knob::after{content:'';position:absolute;inset:13px;border-radius:50%;border:3px solid #1b1033aa;
    background:radial-gradient(circle,#fff8 0 22%,#0000 23%)}
  .pad.act .ring{opacity:1;background:#1b103333}
  .pad.act .knob{opacity:1;transition:none}
  /* and the tap that becomes a jump SAYS SO, because "did that register" is otherwise a
     question you can only answer by watching her */
  .pad.pop .ring{animation:popr .3s ease-out}
  @keyframes popr{0%{transform:translate(-50%,-50%) scale(1);opacity:1}
                  100%{transform:translate(-50%,-50%) scale(1.45);opacity:0}}
  .chip{position:fixed;z-index:4;font-size:12px;letter-spacing:.08em;color:#e8e4f2;
    background:#00000055;padding:4px 9px;border-radius:7px;pointer-events:none}
  #build{top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
    max-width:calc(100vw - var(--chipW,150px))}
  #build b{font-size:19px;color:#5fe1ff;letter-spacing:.04em}
  #build b.pulse{animation:pp .45s ease-out 3}
  @keyframes pp{0%,100%{opacity:1}50%{opacity:.25}}
  #build i{font-style:normal;opacity:.7;margin-left:7px}
  #speed{top:calc(44px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left))}
  #speed b{font-size:17px;color:#ff6fa5}
  #gems{top:calc(76px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left))}
  #gems b{font-size:15px;color:#7ff3ff}
  .key{position:fixed;z-index:6;top:calc(12px + env(safe-area-inset-top));width:44px;height:38px;
    display:flex;align-items:center;justify-content:center;font-size:17px;border-radius:9px;
    border:0;border-bottom:3px solid #00000066;background:#ffffff1c;color:#e8e4f2;
    touch-action:none;-webkit-appearance:none}
  .key:active{border-bottom-width:0;transform:translateY(3px)}
  .key,#newer{touch-action:manipulation}   /* taps yes, double-tap zoom no */
  /* a 48 px pitch, arithmetic rather than taste -- and `hudGutter` measures the row, so
     adding a key can never hide the build chip the way a typed gutter let it */
  #resetB{right:calc(14px + env(safe-area-inset-right))}
  #charB{right:calc(62px + env(safe-area-inset-right))}
  #tailB{right:calc(110px + env(safe-area-inset-right))}
  #goB{right:calc(158px + env(safe-area-inset-right))}
  /* THE TAIL PANEL. He tunes on a phone with no console, so every dial is a slider he can drag
     with a thumb. Above the pads (z 5) so a touch on it is never also a stick. */
  #tailP{position:fixed;z-index:8;display:none;top:calc(58px + env(safe-area-inset-top));left:50%;
    transform:translateX(-50%);width:min(380px,94vw);max-height:calc(100vh - 76px);overflow-y:auto;
    background:#0d0b13e6;border-radius:12px;padding:8px 12px 10px;color:#e8e4f2;font-size:12px;
    letter-spacing:.03em;touch-action:pan-y;-webkit-overflow-scrolling:touch}
  #tailP.on{display:block}
  #tailP h3{margin:4px 0 6px;font-size:12px;color:#5fe1ff;letter-spacing:.12em;font-weight:700}
  #tailP .row{display:flex;align-items:center;gap:8px;margin:5px 0}
  #tailP .lab{width:96px;flex:none;opacity:.85}
  #tailP .trk{flex:1;height:28px;border-radius:14px;background:#ffffff1a;position:relative;touch-action:none}
  #tailP .fill{position:absolute;left:0;top:0;bottom:0;border-radius:14px;background:#5fe1ff59;pointer-events:none}
  #tailP .val{width:40px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
  #tailP .btns{display:flex;gap:8px;margin:6px 0}
  #tailP button{flex:1;height:32px;border:0;border-radius:9px;background:#ffffff1c;color:#e8e4f2;
    font-size:12px;letter-spacing:.06em;touch-action:manipulation}
  #tailP button.sel{background:#5fe1ff;color:#0d0b13;font-weight:700}
  #newer{position:fixed;left:50%;transform:translateX(-50%);z-index:9;display:none;
    top:calc(12px + env(safe-area-inset-top));padding:7px 14px;border-radius:999px;border:0;
    background:#5fe1ff;color:#0d0b13;font-weight:700;letter-spacing:.06em;font-size:13px}
</style>
<script>
  // ---- the crash overlay. It has to exist before anything can throw. ----
  (function () {
    var box = null;
    function paint(msg) {
      try {
        if (!box) { box = document.getElementById('crash'); }
        if (!box) return;
        box.style.display = 'block';
        box.textContent = (box.textContent ? box.textContent + '\n\n' : '') + msg;
      } catch (e) {}
    }
    window.__crash = paint;
    addEventListener('error', function (e) {
      if (e && e.target && e.target !== window && e.target.src !== undefined)
        return paint('FAILED TO LOAD\n' + (e.target.src || e.target.href || e.target.tagName));
      paint((e.message || 'error') + '\n  @' + (e.filename || '?') + ':' + (e.lineno || '?') +
            (e.error && e.error.stack ? '\n' + e.error.stack : ''));
    }, true);
    // AND THE PINCH GESTURE IS A SEPARATE EVENT FAMILY THAT `touch-action` DOES NOT COVER on
    // iOS -- Safari fires its own non-standard `gesture*` events for two fingers, and they zoom
    // the page whatever the CSS says. `dblclick` is belt and braces for the desktop.
    for (var i = 0, G = ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']; i < G.length; i++)
      addEventListener(G[i], function (e) { e.preventDefault(); }, { passive: false });
    addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      paint('UNHANDLED PROMISE\n' + ((r && (r.stack || r.message)) || String(r)));
    });
  })();
</script>

<body>
<div id="crash"></div>
<canvas id="gl"></canvas>

<div id="boot">
  <h1>ROLLERGIRL</h1>
  <div class="msg" id="bootMsg">loading</div>
  <div class="bar"><i id="bootBar"></i></div>
  <div class="bn">build <span id="bootB">r1</span></div>
</div>

<div class="chip" id="build"><b id="buildN">r46</b><i id="buildI"></i></div>
<div class="chip" id="speed"><b>0.0</b> m/s</div>
<div class="chip" id="gems">&#9670; <b>0</b>/<span>0</span></div>
<button class="key" id="resetB" aria-label="respawn">&#8635;</button>
<button class="key" id="charB" aria-label="swap character">&#8644;</button>
<button class="key" id="tailB" aria-label="settings">&#9881;</button>
<button class="key" id="goB" aria-label="go somewhere">&#10148;</button>
<div id="tailP"></div>
<button id="newer">build ready &middot; tap</button>

<div class="pad" id="stkL"><div class="ring"></div><div class="knob"></div></div>
<div class="pad" id="stkR"><div class="ring"></div><div class="knob"></div></div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { DRACOLoader } from './vendor/DRACOLoader.js';
import { mergeGeometries } from './vendor/BufferGeometryUtils.js';

const BUILD = 'r46';
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && innerWidth < 1400);

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
// FRAME-RATE INDEPENDENT SMOOTHING, ALWAYS. Never scrub a value with a bare `*= k` per
// frame: that is an exponential whose half life depends on the frame rate, so the same
// code behaves differently on a 120 Hz phone and a 30 Hz one.
const damp = (cur, tgt, half, dt) => lerp(cur, tgt, 1 - Math.pow(0.5, dt / half));
const decay = (v, k, dt) => v * Math.exp(-k * dt);
const wrapAngle = a => { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; };
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

// ASSET URLS CARRY A CONTENT HASH, written by `npm run bump`. He replaces files in place --
// re-exports the same GLB under the same name -- and a phone that already has that URL keeps
// what it has for ever. A file that changed gets a new URL and arrives; one that did not keeps
// its URL and stays cached. Every runtime asset URL goes through A().
/* ASSETS:START */
const ASSETS = {"images/HDRI_01_2K.jpg":"69af8105","images/hdri_game.png":"dac55f41","models/alien_rollerskate_blue.glb":"6e98dd0a","models/alien_rollerskate_blue_test.glb":"ed7cf656","models/melee_zap.glb":"147e1d14","models/roller_girl.glb":"7efbefe3","models/kit/building_kit_collision.glb":"cb0ddd7e","models/kit/building_kit_generated_visual.glb":"97cbdd9d","models/kit/building_kit_pieces.glb":"04974292","models/props/prop_hydrant.glb":"f157fee9"};
/* ASSETS:END */
const A = p => ASSETS[p] ? p + '?v=' + ASSETS[p] : p;

// ---------- tunables ----------
// Everything worth arguing about is a number here, and every one of them is on `window.rg`.
const RIG = {
  height: 1.70,        // metres, crown to soles. Everything else is tuned to this.
  spin: 0,             // extra yaw on the model if the export faces some other way
  foot: 0.02,          // sink the soles this far so the wheels bite rather than float
  alphaTest: 0.5,      // her material exports as BLEND+doubleSided; a cutout sorts, alpha does not
  // WHAT SHE ROTATES ABOUT. `p.pos` is her FEET -- it is the point the collider answers for --
  // and a body flipping about its feet swings its head through a two-metre arc, which reads as
  // being swung on a rope. In the air the pivot lifts to her middle; on the ground it is zero,
  // because there the tilt has to leave her soles exactly on the surface.
  pivot: 0.62,         // fallback only: the air pivot is her measured HIPS (r29, `airPivot`)
  pivotAdj: 0,         // metres above (+) or below (-) her hips that she flips about
  pivotHL: 0.10,
  tiltRate: 7,         // how fast the standing pose tracks the surface under her -- the TILT only (r33:
                       // 12 read as a snap rolling over the edge of a ramp; *"I want that eased"*);
                       // the yaw is taken straight off `faceH` (r27), so a turn is not eased twice
  // WHERE SHE TURNS ABOUT (r27). *"My root joint is slightly behind her centre of gravity, so when
  // you turn she feels like a boat -- she rotates from a point behind her."* Measured: the alien's
  // hips sit 0.117 export units -- about 0.2 m once scaled -- IN FRONT of the root in every clip,
  // so the whole body swung round a point behind her. 1 slides the model so her HIPS are on the
  // axis everything turns about; 0 is the export's root, as before. Read off the rig at load, so
  // a re-export with the root under her needs no edit.
  centre: 1,
  // WHERE SHE LEANS (r42). *"Something about the rotation at the origin makes it feel like a boat -- I could
  // see her leaning at the HIPS and the legs compensating, so she bends her inside knee."* 1 puts the whole
  // lean into her HIPS bone, about her forward axis -- the body above tips in, the legs swing out under it,
  // and the foot IK (`footGround`) then sets both skates back on the surface, bending the knee that has to
  // bend. 0 is the old lean of the whole body about her feet.
  hipLean: 1,
};

// HER FEET ON THE GROUND (r36, `footGround`, `legIK`). *"The feet don't quite touch the ground -- it
// feels like she's floating slightly, very subtle. Maybe an additive layer, a little IK on the leg
// chains so her legs are always approximating the ground, and the feet parallel to it."*
// WHY SHE FLOATS: the alien's Hips TRANSLATION is a constant in every clip (the r15 note) -- so every
// crouch, every bent knee in a push, folds her legs up UNDER a pelvis held at standing height, and her
// skates leave the floor. Same landmine Shredworld paid for on its borrowed clips.
// SO, ON THE GROUND, AFTER THE MIXER, EVERY FRAME:
//   1. the sole of each skate is measured -- a point fixed in the FOOT BONE's frame, found at load as
//      the floor directly under the ankle in her rest pose, so nothing is typed in metres;
//   2. the body DROPS until the lower skate touches (`maxDrop` at most, eased), which is most of it;
//   3. the other leg gets a two-bone IK (thigh + shin, knee kept in its own bend plane) that pulls its
//      skate down to the surface IF it is within `near` of it -- a foot the clip lifts higher than that
//      is a stride or a trick and is left alone, fading in between;
//   4. both feet turn so the sole lies flat on the surface (`align`, at most `alignMax`).
// It is an edit ON TOP of the pose, undone before the next mixer update, so it cannot accumulate.
// In the air, on a rail and in a bail it eases out.
const FOOTIK = { on: 1, maxDrop: 0.25, maxRaise: 0.06, near: 0.16, align: 1, alignMax: 40 * Math.PI / 180, hl: 0.05, sink: 0.0 };

// MELEE, BORROWED FROM ZAP (r39, `MELEE`, `meleeStrike`, `meleeSlide`, `stepMelee`). r44: the flying kick is
// gone -- a right flick in the air is the same melee chain, played from each clip's airborne window.
// *"I love his melee system -- for now a flick of the right stick on the ground strings them the way he
// does. Left stick flick is the slide tackle. In the air a right flick is the flying kick, which drives
// her forward -- and near a grind pole, flicked toward it, she targets the pole and kicks into a grind,
// because it's really hard to grind right now."* The clips are Zap's, lifted by `npm run borrow` into
// `models/melee_zap.glb` (same bind pose as hers to 0.03 deg, hips movement scaled by leg length).
//   RIGHT FLICK, ground   the next clip of the pool, played at `rate` (a beat of `beatMin..beatMax`),
//                         her body turned to face the flick (through the camera) while she keeps
//                         rolling; a flick during a strike is QUEUED, never cuts it -- weirdport's rule
//                         that a strike is never interrupted. A swipe UP on a steep face (`xferN`), on
//                         a rail or off a lip is still the transfer jump.
//   LEFT FLICK, ground    the slide tackle, along her travel, with a shove of speed.
//   RIGHT FLICK, air      the flying kick: driven toward the flick at `airV`, once per airtime. If a
//                         rail lies within `aimR` and `aimCone` of that direction she is SOLVED onto it
//                         -- the horizontal speed that gets her there and the vertical speed that arrives
//                         at the bar's top at the same moment -- and the catch is relaxed for that rail.
const MELEE = {
  on: 1, file: 'models/melee_zap.glb', failed: 0,
  fist: ['melee_01', 'melee_02', 'melee_03', 'melee_04', 'melee_05', 'melee_extra'],
  weap: ['weapon_melee_01', 'weapon_melee_02', 'weapon_melee_03', 'weapon_melee_04'],
  useWeap: 0,          // 1 deals his blaster melees into the pool too
  rate: 1.75, beatMin: 0.55, beatMax: 1.30,     // weirdport's: the clip compressed to a readable beat
  lunge: 2.5,          // m/s shoved along the strike on the ground
  xferN: 0.8,          // a face steeper than this (normal's y under it) makes a swipe UP the transfer
  slide: 'slide_kick', slideDur: 0.95, slideV: 4, slideFlip: 1,   // r46: slideFlip -- a slide out of fakie comes up forward
  air: 'flying_kick', airDur: 0.85, airV: 10, airUp: 2.5,
  aimR: 13, aimCone: 0.75, lead: 1.5, vyMax: 15, grindV: 9,
  liftMax: 0.9,        // how far a ground strike may lift her to keep the lowest skate on the surface
  // r44: MELEE IN THE AIR. *"Get rid of the in-air flying kick -- make it the same as the melee on the ground,
  // so you can string melees in the air. Some need clipping for the air: one starts with her doing a little hop
  // off the ground, and you wouldn't jump off the ground, you're in the air."* So in the air each clip plays
  // only its WINDOW -- the part where her feet are off the floor, MEASURED on her rig (longest run of the lower
  // foot over .12 of a leg, padded .04 each side; `npm run sim melee` re-measures and fails if this table goes
  // stale). A clip that never leaves the ground (the standing punches) plays to `airDef`'s end, before its
  // settle. When the window is spent she goes back to the AIR POSE -- never a standing pose in mid-air.
  airWin: { melee_01: [0.26, 0.72], melee_02: [0.26, 0.61], melee_03: [0.34, 0.64], melee_04: [0.31, 0.64], melee_05: [0.06, 0.94] },
  airDef: [0, 0.85],
  airLunge: 3,         // m/s toward the flick in the air
  airLift: 2,          // the first strike of an airtime props her up this much (m/s); later ones do not
  airAim: 1,           // an air strike flicked toward a rail is solved onto it (what the flying kick used to do)
};

// THE ROSTER. ONE CHARACTER AT A TIME -- a switch is a menu action, not a parade, so there is
// no second root, no second mixer and no second weight table to keep in step. The pick lives
// in `localStorage`, because a character you have to re-choose after every reload is one
// nobody chooses twice. `spin` is per character for the same reason `RIG.spin` exists: which
// way an export faces is the one thing no offline check here can settle.
const CHARS = [
  { key: 'alien', file: 'models/alien_rollerskate_blue.glb', name: 'alien', spin: 0, borrow: 1 },
  { key: 'girl',  file: 'models/roller_girl.glb',                 name: 'rollergirl', spin: 0 },
];

// THE TAIL IS A CHAIN OF POINTS IN WORLD SPACE, SOLVED AND THEN CONVERTED BACK TO BONE
// ROTATIONS -- which is this file's answer to the question he actually asked: he drives the
// chain in Cinema 4D with an IK and dynamics on, and the choice is between solving it live
// here and baking that motion into the joints. **This is the live half, so that there is
// something to compare against.** Baking is a drop-in whenever he wants it: `tailStep` stands
// itself down the moment a clip genuinely drives those bones (`tailFind` measures it), so a
// baked export needs no code change at all.
//
// POSITION-BASED DYNAMICS, NOT A SPRING PER JOINT. The segment lengths are HARD constraints,
// so the tail can never stretch however hard she is thrown about, and the whip falls out of
// the velocity recovered AFTER the constraints rather than being tuned in. That is the nearest
// honest analogue of an IK chain with dynamics: the IK is the length constraint and the
// dynamics is what the points do between solves.
const TAIL = {
  on: 1,
  match: /^tail/,      // found by name from `tail` outward, taking the single matching child
  // ---- TWO WAYS TO MOVE IT, AND WHICH IS HIS CALL (r19) ----
  // 'wave'  HIS VISUALIZER'S METHOD, and the default. *"Every subsequent position in the arm looks
  //         at the previous one and eases to it, but the rate it eases is slower than the layer
  //         above it -- like sending a wave down a rope, it dissipates as it goes down."* No
  //         physics at all: each bone's orientation eases toward where its PARENT, as it is
  //         actually drawn, would carry it rigidly -- quickly at the root, slower at every joint
  //         toward the tip. The driver is whatever the body does: her turning, and the 21 degrees
  //         of hip twist in every stride of her mocap. It cannot go unstable, because an ease is
  //         a weighted average and an average cannot overshoot.
  // 'sim'   the position-based dynamics below, with his C4D-named dials. Kept for the A/B.
  mode: 'wave',
  // HOW FAST EACH JOINT CATCHES ITS PARENT, per second, falling GEOMETRICALLY from root to tip
  // by arc length -- "exponentially less", his words. Frame-rate independent: the fraction
  // eased in a step is `1 - exp(-rate * dt)`, so a 20 Hz phone and a 60 Hz one wave the same.
  waveRoot: 30,
  waveTip: 7,
  // THE MOST ANY ONE JOINT MAY LAG ITS PARENT, in degrees. Eases ACCUMULATE down a chain -- a
  // steady spin at rate w leaves each joint about `w / rate` behind, and thirteen of those add
  // up -- so without a cap a long spin curls the tail round on itself.
  waveMax: 14,
  // WHAT DRIVES THE BASE (r20). His visualizer's arm was driven by a WAVEFORM at its first
  // segment; this tail was driven only by her hips, and *"there's no natural rotation in the hips
  // really"* -- so on its own it read as stiff. These feed the base and the cascade above turns
  // each of them into a wave down the tail, exactly as the waveform did there. All of them are
  // read off the tail root's OWN motion, so any rig works and the headless test can drive them.
  sway: 20,            // degrees of side-to-side at the base -- his waveform, standing in for hip
  swayHz: 0.55,        //   travel the mocap does not have yet. Two sines, so it never reads as a
                       //   metronome. 0 turns it off.
  turnSwing: 10,       // degrees the base swings OUT per rad/s of turn -- a tail flung wide
  lift: 1.5,           // degrees the base lifts per m/s^2 of forward acceleration (dips braking)
  speedLift: 0.6,      // degrees it streams up per m/s of speed, capped at `liftMax`
  liftMax: 24,
  // ---- HIS CINEMA 4D IK-DYNAMICS DIALS, BY NAME (r16) ----
  // *"I'm wondering if I were to give you the parameters inside of Cinema 4D if that would
  // translate at all."* **The CONCEPTS translate; the NUMBERS do not, one for one.** C4D
  // integrates per frame in its own units and this integrates per second in metres, so the
  // values below start at his and are tuned on the phone rather than trusted. What each one IS
  // carries over exactly, and three of the four were things this solver did not have at all:
  //
  // STRENGTH -- how much of the simulation you SEE, against the authored pose. He ran 20-30%.
  // The chain is simulated at full strength and the DISPLAYED chain is the authored one moved
  // `strength` of the way toward it, segment by segment, so a lazy, loose simulation can still
  // read as a tail that mostly holds its shape. That is a different look from a stiff
  // simulation and the one his C4D setup had: big slow motion, shown small.
  strength: 0.50,
  // POSITION HOLD -- the spring pulling each point back to where the animation puts it. He ran
  // 100%. `posK` is what 100% means here (a rate, per second squared), so 1.0 is the r15 tail.
  // **AND HIS 100% UNDER HIS 30% STRENGTH IS A TAIL WELDED ON**, which is the clearest case of
  // the numbers not translating: a stiff simulation shown at 30% moves the VISIBLE tail 2 cm
  // through a turn. His look was a loose simulation shown small, so the hold comes down instead:
      //   posHold strength   shown in a dash   shown in a turn   kink (95th pct)
      //     1.00     0.3         0.08 m            0.02 m             4.7 deg
      //     0.50     0.3         0.15              0.03               5.9
      //     0.30     0.3         0.26              0.06               6.3      <- shipped
      //     0.15     0.3         0.33              0.11               6.7
  posHold: 0.30,
  posK: 140,
  // ROTATION HOLD -- bending stiffness, which the r15 solver had NONE of, and it is the one that
  // stops the flailing. Position hold pulls each point toward an absolute place; it says
  // nothing about the ANGLE between neighbouring segments, so a chain can kink into a zig-zag
  // while every point sits a centimetre off its goal. Rotation hold pulls each segment toward
  // the angle it makes with its PARENT segment in the authored pose -- so the tail keeps its
  // curve and moves as a curve. He ran about 30%. It is a fraction per 60 Hz frame, corrected
  // for the actual frame rate so a 20 Hz phone bends the same as a 60 Hz one.
  rotHold: 0.15,
  // ...AND BOTH HOLDS ARE GRADED ROOT TO TIP, which is the middle ground between "a stick with a
  // floppy end" and a rope (r18). `rotHold` / `posHold` are the values at the ROOT; `rotTip` is
  // rotation hold at the tip, and `posTip` is the fraction of position hold left at the tip.
  // Graded by ARC LENGTH, not by joint index -- his last three segments are the longest in the
  // chain, and by index they would get a third of the falloff for over a quarter of the length.
  // *"Now it is like a long stick with the end kind of floppy."* Measured, that is exactly what
  // uniform holds produce: 46% of all the bending in the last 3 of 13 joints (even is about 23%),
  // and the whole tail moving 4 cm through a turn. The tip is the least held-in (nothing beyond
  // it) and the longest lever, so with the same stiffness everywhere the bend pools there.
  // Soft at the root and stiff at the tip moves it into the middle -- through a turn:
  //     rotHold/rotTip  posTip  strength   tip moves   bend in last 3   along the tail
  //       .30 / .30       1.0     0.3       0.044 m        46%          000124567778999  (r17)
  //       .15 / .70       1.0     0.3       0.076          24%          000112344455789
  //       .15 / .70       0.5     0.5       0.184          24%          000112233445689  <- shipped
  // (measured after the one-frame spring bug below was fixed; every number before r18 carried it)
  rotTip: 0.70,
  posTip: 0.50,
  // DAMPING -- the chain's internal friction, damped RELATIVE TO HER BODY (a tail travelling
  // along with her is not moving as far as that friction is concerned; damped against the WORLD,
  // keeping up with her reads as motion to damp and it settles 1.5 m behind a 0.88 m chain).
  // His 10-15 is a C4D percentage and does not map; 6 is per second, and the r15 sweep found
  // that UNDER about 6 the chain whips (tip at 17-31 m/s on a 7.2 m/s body) at any stiffness.
  damping: 6,
  // START THE CHAIN FURTHER DOWN -- *"I started the IK a little higher up the joint chain, like
  // at the second or third joint, so the first one or two had some stiffness."* `pin` bones from
  // the root follow the animation exactly and the dynamics start after them.
  pin: 2,
  // AND A BODY TO HIT, which C4D would have given him for free with a collider tag. Capsules
  // between her own bones, radii as fractions of her height, so a re-export at any size lands
  // right. **A point whose AUTHORED position is already inside a capsule is left alone** --
  // the root of a tail lives inside the pelvis by construction, and pushing it out would fight
  // the animation every frame.
  body: [
    ['mixamorig_Hips', 'mixamorig_Spine2', 0.075],
    ['mixamorig_LeftUpLeg', 'mixamorig_LeftLeg', 0.046],
    ['mixamorig_LeftLeg', 'mixamorig_LeftFoot', 0.034],
    ['mixamorig_RightUpLeg', 'mixamorig_RightLeg', 0.046],
    ['mixamorig_RightLeg', 'mixamorig_RightFoot', 0.034],
  ],
  r: 0.025,            // the tail's own thickness, for the body and the floor alike
  // ---- the rest, which are this solver's and not his ----
  // `air` is drag against still air, which is what makes a tail trail at speed at all -- and
  // since r18's spring fix it is the ONLY thing that sweeps the tail back at a steady speed, so
  // it is measured at HER speeds, not at a jog. Shown, at a steady cruise:
  //     air    8 m/s    15 m/s   24 m/s
  //     0.9    0.163    0.291    0.386 m    -- half the chain held back at top speed
  //     0.4    0.077    0.130    0.216      <- shipped: a sweep you can read as speed
  air: 0.4,
  // GRAVITY IS OFF, ON HIS C4D SETUP -- *"I think I removed gravity on the dynamics, which is
  // less realistic, but it could create a nice ease."* It does, and it costs nothing: the swing
  // is the same size and the curve comes out smoother, because gravity was a constant load the
  // holds spent their effort fighting rather than a motion anybody reads as a tail.
  //     grav   sag at rest   shown in a dash   shown in a turn   kink (95th pct)   tip
  //     0.30     0.094 m         0.256 m           0.062 m           6.3 deg      12.3
  //     0.15     0.054           0.258             0.055             4.4          11.0
  //     0.00     0.000           0.247             0.045             3.0           9.9   <- shipped
  // And at zero the tail at rest IS his authored pose, exactly, which is worth having.
  grav: 0,             // of the game's own gravity
  // NO ITERATION COUNT, AND SUBSTEPPING AT ONE, BOTH MEASURED. The length projection is
  // root-outward and DIRECT, so it is exact after one pass -- 3 passes and 10 gave byte-identical
  // numbers. And substepping made the violent cases WORSE (a 5.6 rad/s shake went 35 -> 169 m/s
  // at the tip as `sub` went 1 to 8), because the floor, the body and the length projection are
  // POSITION corrections whose size does not shrink with the step while the velocity recovered
  // from them is divided by it.
  sub: 1,
  // A ROOT THAT MOVED FURTHER THAN THIS IN ONE FRAME IS A TELEPORT, NOT A SKATER, so the whole
  // chain re-seeds rather than being dragged across the park behind a respawn.
  snap: 1.5,
  tip: 1.0,            // `tail_13` has no child, so its own length stands in for the last span
};

// THE SHIPPED VALUES, captured before `tailLoad` applies anything saved on the phone -- read a
// moment later this would be whatever is in `localStorage`, which is the opposite of a default.
const TAIL_DEF = { ...TAIL };

// THE SKATE MODEL. Velocity lives in world space and is decomposed against the SURFACE she
// is on, not against the world -- which is the whole reason transitions work: on a quarter
// pipe "forward" is up the wall, and gravity's component along that wall is what slows her
// down on the way up and gives it back on the way down.
const SK = {
  g: 20,               // gravity. Games are not 9.81; this is the number the jumps are tuned to.
  // LETTING GO OF THE STICK ON THE FLAT COSTS MOMENTUM (r23) -- *"you have to actually push the
  // stick forward to pump; if you let go you continue rolling, but your momentum does fade."* On
  // top of `roll`, only with the thumb off, and only once she has been on FLAT ground for
  // `coastAfter` seconds. That second half is the whole design: a half pipe's bottom is flat too,
  // and fading there took a no-input swing from 1.86 m peaks to 1.52 / 1.10 / 0.75 -- the ramp
  // dying under her, which is the landmine `roll` was lowered for. She crosses a pipe's flat in
  // well under a second; a stretch of plaza is several.
  coast: 0.12,
  coastAfter: 1.2,
  roll: 0.04,          // rolling resistance along the wheels (per second, exponential).
                       // 0.16 was a 4.3 s half life, which is a third of her energy per
                       // swing of a transition -- the half pipe visibly died under her.
  grip: 7.0,           // how fast a SLIDE is scrubbed off once the edges have lost it
  // THE WHEELS REDIRECT HER SPEED, THEY DO NOT DELETE IT -- and this is the single number
  // that decides whether carving feels like skating or like sandpaper. `gripA` is the most
  // lateral acceleration the edges can supply, so the fastest the VELOCITY can be turned is
  // `gripA / v` rad/s. Ask for less and she carves with no loss at all; ask for more and the
  // surplus is a slide, which `grip` then scrubs. One number, both behaviours, and the drift
  // at the limit falls out rather than being a second system.
  gripA: 30,           // r27: 18 -> 30. *"Responsive and exaggerated, like Jet Set Radio"* -- 18 let
                       // the velocity bend only 1.3 rad/s at 14 m/s, which is the boat
  // STEERING. Skates turn tighter than a skateboard and can pivot on the spot, so the rate
  // falls with speed rather than being a flat number.
  turn: 7.0,           // rad/s at a standstill (r27: 5.2)
  turnV: 2.4,          // rad/s at turnRef and above (r27: 1.35 -- a 90 at cruise took over a second)
  turnRef: 14,         // m/s where the turn rate has fallen all the way
  turnBrake: 0.09,     // a hard carve costs speed -- this is what plants the edge (r27: .16, which
                       // at the new turn rate would have eaten a third of her speed per 90)
  // THE PUSH IS A STROKE, NOT A STEP. Each stride used to land its whole delta-v on ONE
  // frame, which reads as a staircase on the speedometer and not as a foot hitting tarmac.
  // The same total is spread over `strokeDur` on a half sine: the integral of
  // (pi/2)sin(pi*u) over one cycle is exactly 1, so the top speed is unchanged.
  pushV: 7.4,          // delta-v per stride at a standstill
  taper: 0.86,         // how much of that is lost as she approaches pushMax
  pushMax: 27,         // no more pushing past this -- legs cannot keep up
  swivelT: 0.6, swivelRate: 6,   // r42: the swivel's half turn, eased (about half a second)
  pushFast: 0.52,      // stride period at a standstill (quick, hard strides)
  pushDur: 1.05,       // stride period at cruising speed (long, lazy glides)
  pushEase: 15,        // speed at which the period has fully stretched
  strokeDur: 0.34,     // how long one stroke's impulse is spread over
  plant: 0.30,         // where in the cycle the foot is actually on the ground
  grace: 0.45,         // a thumb off and back on inside this is ONE cycle, not two
  ahead: 0.35,         // how squarely the thumb must point along her to count as a push
  // BRAKING is a latch: a thumb held behind her is a brake until the thumb LEAVES it.
  // Without the latch she carves round to face the thumb and the brake becomes a push,
  // which is "it should slow me down but instead it turns me".
  back: -0.35,
  brake: 12.0,
  fakieAt: 1.2,      // below this she always turns to face the thumb rather than riding backwards
  // PUMPING. On anything steeper than `pumpAt` the stride stops being a stride and becomes
  // a pump -- energy put in along the slope, which is how you get up a transition.
  pumpAt: 0.22,        // 1 - n.y, so about 12 degrees
  pump: 9.0,
  // GROUND TRACKING. `stick` is how far the surface may fall away under her in one frame
  // before she is airborne; on a 2 m transition at 10 m/s that gap is under a centimetre,
  // and off the lip of a kicker it is a metre, so one number separates them cleanly.
  step: 0.42,          // how high a lip she rolls straight over
  // HOW FAR THE SURFACE MAY FALL AWAY UNDER HER IN ONE STEP BEFORE SHE IS IN THE AIR -- AND IT
  // IS THE GEOMETRY'S OWN OVERSHOOT, NOT A TYPED NUMBER. Moving `l` along a curve of radius R
  // the tangent leaves the surface by exactly `l^2 / 2R`, so that IS the threshold: anything
  // more is a real departure. A flat 0.14 m was far too sticky at the top of a near-vertical
  // wall, where her step is mostly VERTICAL and the surface only creeps forward -- she stayed
  // glued to the lip, met the flat coping still grounded, and the re-projection took the whole
  // of her climb: **18.4 m/s of vertical annihilated in one frame**, with nothing on screen to
  // say why. Which is the kicker's flat-coping landmine again, on the one ramp I argued was
  // safe from it.
  stick0: 0.035,       // the floor, for numerical noise
  stickR: 2.0,         // the tightest transition she is expected to hold
  // AND A HEIGHT TEST CANNOT SEE A SLOPE CHANGE, which is the other half and the one that
  // matters at a lip. Where a transition meets its coping the surface height barely moves and
  // the ANGLE jumps ninety degrees -- so `drop` stays tiny, she is snapped onto the flat, and
  // the re-projection deletes her whole climb. The honest question is whether the new face is
  // still pushing her onto it: `vel . n` is NEGATIVE while she is tracking a concave curve and
  // goes sharply POSITIVE the moment the surface turns away under her. That is a launch, and it
  // is one rule for every convex crease in the park -- a coping, a kicker's lip, the top edge
  // of a funbox -- rather than a special case each.
  leave: 0.6,
  // THE COLLIDER IS SAMPLED AT A POINT, so how far she moves between samples is how far she can
  // get into something before anything notices. At 20 m/s a 60 Hz frame is a THIRD OF A METRE,
  // and a near-vertical transition is only a few centimetres wide in plan -- so she crosses the
  // whole footprint of the wall in one step and comes out the other side. Sub-stepping the
  // integration so no step is longer than this costs two iterations at speed and nothing at all
  // below 12 m/s.
  sub: 0.18,
  subMax: 6,
  smoothAng: 0.62,     // a direction change under this is a transition and costs no speed;
                       // anything sharper is an impact and loses the component into the face
  // A LANDING THAT GRAZES THE SURFACE KEEPS NEARLY EVERYTHING AND A SLAM KEEPS ALMOST
  // NOTHING, which is one number rather than two cases. Dropping back into a transition at
  // the angle of the wall is the whole sport; taxing it the way a flat slam is taxed is
  // what makes a ramp feel like glue.
  landKeep: 0.85,
  // THE BANK IS A HINT, NOT A PHYSICS DEMONSTRATION. 0.085 with a 0.62 rad ceiling let her lie
  // over THIRTY-FIVE DEGREES in a hard carve, which reads as a motorcycle rather than a skater
  // and fights whatever the clip is doing. (r27: replaced by a physical lean, below.)
  // r27: *"every time you make a car or anything turn it leans AWAY from the turn -- that gives this
  // rocking-boat feeling. She needs to lean INTO a turn, and backwards it's the opposite of herself
  // but still the same direction for the player."* So the bank is no longer worked out from the
  // STEER sign (which says which way her NOSE turned, and is backwards in fakie) but from what the
  // turn physically IS: the rate her TRAVEL is bending, times her speed, is the sideways
  // acceleration, and a skater tips toward that -- `atan(a / g)`, the angle a body has to lean to
  // stand up in it. Toward the centre of the turn in the WORLD, whichever end of her leads.
  leanK: 0.45,         // of the physical lean angle -- 1 is a motorcycle
  leanMax: 0.31,       // ...and never past about eighteen degrees
  leanMinV: 1.5,       // slower than this there is no turn worth leaning into
  leanHL: 0.08,
  faceRate: 32,        // per second: how fast her body comes round onto her heading
  landYaw: 7,          // r33: ...and how fast after a landing squares her onto her line
  dead: 0.14,          // stick dead zone
  curve: 1.35,         // stick response curve
  max: 42,             // hard speed ceiling, so nothing can run away
};

// SHE CARRIES THE RAMP'S ANGLE INTO THE AIR. Leaving the lip of a vert wall you are ninety
// degrees to the ground, and you stay there -- what rights you is the next second of the air,
// not the frame you left. So the body is a real QUATERNION from the moment she leaves: seeded
// from the surface she left, turned by the left stick while she is up there, and checked
// against the face she comes down on.
// THE JUMP ADDS TO HER LINE, IT DOES NOT REPLACE IT -- AND IT GOES WHERE THE RAMP IS POINTING.
// *"Velocity needs to carry in the jump, it just adds to it, so the jump should kinda launch you
// in the direction of the tip of the ramp."* So the pop is along the direction she is ALREADY
// TRAVELLING over the surface, blended toward world up by how much of that travel is upward:
//   flat out, or dropping   -> straight up, which is the only thing a jump can mean there
//   up a 38 degree kicker   -> 58 degrees, steeper than the ramp but along it
//   up an 88 degree wall    -> straight up, and she comes back down the same pipe
// One expression, and the vert case and the flat case fall out of it rather than being cases.
// It replaces `popNorm`, which asked about the surface NORMAL -- on a wall that points sideways
// into the pipe, which is the opposite of where she is going.
const AIR = {
  jump: 12.5,          // the size of the pop, ON TOP of whatever she is carrying
  popTravel: 1.0,      // 0 pops straight up always; 1 follows her line up the ramp
  coyote: 0.11,        // grace after rolling off an edge
  // **NO FLIP.** *"I'm not sold on the flip -- maybe we'll just have her rotate in the air for
  // now, left and right."* So the pad's X is a yaw RATE and its Y is THRUST: *"in the air you'll
  // hold forward"*, which is how you clear the back of one ramp and reach the next.
  spinFull: 0.55,      // r27: of the pad's travel at which the spin is already full speed
  spin: 7.5,           // rad/s of yaw. r26: *"she needs to rotate in the air faster"* -- 4.2 was 240
                       // deg/s, a 360 in 1.5 s, longer than most airs; 7.5 is a 360 in 0.84 s
  drift: 11,           // m/s^2 along her facing while the thumb is forward
  driftMax: 8,         // ...and the most it may add, so a long flight is not a free flight
  // AND SHE IS UPRIGHT UP THERE. *"Her rotation is matching the normals of the ramp -- I don't
  // think I meant that."* Right: a skater flying out of a vert wall is UPRIGHT going straight
  // up, not lying on her side parallel to the wall. She leaves holding the ramp's angle and
  // comes upright over `ease`, which reads as straightening out rather than as a snap.
  ease: 4.5,
  // r33: the SETTLE (right pad held down in the air) and the PRE-ALIGN -- see `stepAir`
  settleAt: 0.55,      // how far DOWN the right pad has to be held
  settleDrag: 4,       // per second: how fast her horizontal speed bleeds off while settling
  settleEase: 9,       // per second: how fast her body turns onto the face below
  preAlign: 0.4,       // seconds: falling, this close to touchdown, she turns to match the surface
  pitch: 0,            // 1 leans her into the arc instead; 0 is plumb
  // THE BAIL IS OFF. It compared her own up to the face she landed on, which only means anything
  // while the body is free -- upright in the air, every drop back into a transition is eighty
  // degrees "out" and she would lose it every single time. The mechanism stays for the day
  // there is a flip again: `rg.AIR.land = 0.95` arms it.
  land: 99,
  bailT: 1.1, bailKeep: 0.35, bailDrag: 2.6, right: 3.2,
  startT: 0.16,        // how long `jump_start` holds before `jump_in_air` takes over
  tapT: 0.30,          // a tap is a tap; a hold is a camera drag and is NOT a jump
  tapFar: 0.45,        // ...and how far the thumb may wander and still be a tap
};

// ---- LANDING, STANCE, FLIPS AND BAILS (r21) ----
// *"If you jump in the air and land so that you're in the second 180 degrees of the circle with
// your back forward, now you're in fakie -- even if you're pushing forward she's still going
// forward, she's just doing it backwards."* And: *"if you land kind of sideways she will fall --
// you have to land not perfectly straight or perfectly back but within some range."*
// So a landing compares her BODY's forward with where she is actually travelling, in the plane of
// whatever she came down on: near the nose is forward, near the tail is fakie, anything in
// between is a bail. Only for a skin with backward clips (`stanceLock`), because a fakie with no
// clip to sell it is a state with nothing to show for it.
const LAND = {
  ok: 55 * Math.PI / 180,  // how far off straight -- either way round -- still counts as landed
  minV: 2.0,               // slower than this along the surface there is no direction to be wrong against
  flipDone: 0.8,           // a flip less than this far round when she touches down is a bail
  // a flip is timed to the air she has LEFT when it is flicked: this much of it, inside these bounds
  // r26: flipMax 2.4 -> 1.0 and flipFill .85 -> .75 -- on a big air the flip was stretched across
  // two seconds of hang time, which reads as slow motion; now it goes over quickly and she spots
  // the landing in the air pose
  flipFill: 0.75, flipMin: 0.35, flipMax: 1.0,
  bailT: 3.2,              // a bail's whole length: going down, and getting back up
  // OFF BY DEFAULT (r23): *"let's get rid of the falling over -- she lands no matter how you land,
  // forward or backward."* A sideways landing takes whichever end is nearer, and an unfinished flip
  // simply lands. The mechanism stays; 1 here (or the panel) brings it back.
  bail: 0,
};

const CAM = {
  el: 0.20,            // downward pitch, FIXED -- the right pad orbits in a circle only
  look: 1.05,          // how far up her body the lens aims
  dist: 5.2, distV: 0.17, min: 1.7, max: 13,   // r34: 6.0 -> 5.2, *"so the character seems a little bigger, just a touch"*
  yawRate: 2.9,        // how fast the right pad swings the shot
  idle: 0.55,          // how long after letting go before the lens comes back behind her
  follow: 2.6,
  spring: 1,           // r42: 1 eases the follow in (a critically damped spring), 0 is the old instant follow
  followAir: 0.5,      // ...and it nearly lets go in the air, or a spin is unreadable
  half: 0.09,          // position damping half life
  outHL: 0.30,         // boom: snap IN, ease OUT
  clear: 0.55,         // never let the lens through the floor
  rise: 3.2,
  fov: 62, fovRush: 11, rush0: 8, rushSpan: 14,
};

// THE PERIMETER HAS TO BE TALL, NOT STEEP. She carries 24 m/s now, which is 14.4 m of climb --
// so a 4 m berm is something she flies over, and no amount of STEEPNESS changes that (a bank only
// has to be steep enough to turn her round; what stops her is HEIGHT). At 6.6 m it holds anything
// arriving under about 11.5 m/s and takes most of the speed off the rest, and there is an apron
// behind it for the launches that do get over.
// r45: the apron is the CITY'S GROUND now -- it runs on 230 m past the bank in every direction, so the
// district to the north stands on the same floor the park does -- and the north bank has a GATE in it
// (`gate` is its half width) so she can roll out at street level as well as over the top.
const PARK = { S: 70, cell: 5, wallR: 10.0, wallSweep: 70 * Math.PI / 180, wallBack: 14, apron: 230, gate: 9,
  // HOW VERTICAL THE HALF PIPE'''S WALLS ARE IS THE WHOLE OF "you come back down the same pipe".

    // face the thumb, `fwdR` flips positive, the brake becomes a PUSH, and a held brake reads
    // as a 180 into an acceleration -- *"it should slow me down, instead it turns me"*.
    // AND THE LATCH NEEDS A REAL ZONE, NOT A SIGN TEST: a thumb held exactly sideways puts
    // `fwdR` at +/-1e-17, so whether she is "leading with her back" would be decided by
    // rounding, and one frame of that kills the steering for the rest of the session.
    const back = fwdR < SK.back;

    // round and pushes off the other way. On skates that is one input, not two.

      // speed rather than being flat -- and it is a RATE, so the heading eases onto the thumb
      // instead of snapping to it.

      const d = clamp(rel, -rate * dt, rate * dt);

  // The heading has moved; now the VELOCITY follows it, by as much as the edges can hold. At
  // full grip the pair is unchanged in the new frame, which is a velocity rotated with its
  // magnitude intact -- a carve that costs nothing but `turnBrake`. Past the limit the
  // remainder `e` is the slip angle, and she is sideways to that extent.
  const turned = p.steer * dt;

  // the speedometer read 9, 9, 9, 13, 13, 13 -- a staircase, which is not what a foot hitting
  // tarmac does. The same total is spread over `strokeDur` on a half sine: the integral of
  // (pi/2)sin(pi u) over one cycle is exactly 1, so the top speed is untouched.
  // AND SHE PUSHES IN FAKIE: the stroke goes along the LEADING end, so a thumb pointing where she
  // is rolling backwards speeds her up backwards. Without `stanceLock` the old rule stands.

    p.pushPeriod = lerp(SK.pushFast, SK.pushDur, clamp(spd / SK.pushEase, 0, 1));
    const shove = () => {
      p.shoveDir = lead;
      p.shoveV = SK.pushV * (1 - SK.taper * spd / SK.pushMax);
      p.shoveDur = Math.min(SK.strokeDur, p.pushPeriod * 0.7);
      p.shoveT = p.shoveDur;
    };
    // ONE CLOCK, AND A PHASE RATHER THAN A STOPWATCH. `pushT` is the phase in [0,1), not raw
    // seconds -- the period MOVES with speed, and `T / P(now)` and the integral of `dt / P(t)`
    // are the same number only while P is constant, which it never is while she is speeding up.
    if (!p.pushing) {
      // A THUMB THAT CAME OFF AND WENT BACK ON IS ONE CYCLE, NOT TWO. Every release used to
      // restart the cycle at the plant and fire a stroke on the frame the stick came forward,
      // so a jiggled thumb was four strokes and a new rhythm each time.
      const warm = p.pushOff < SK.grace && p.pushT > 0;
      p.pushing = true;
      if (!warm) { p.pushT = SK.plant; shove(); }
    } else {
      const was = p.pushT;
      p.pushT += dt / Math.max(0.2, p.pushPeriod);
      if (was < SK.plant && p.pushT >= SK.plant) shove();

    p.shoveT -= dt;

  // stride is a foot on flat ground and stops at `pushMax`, a pump is a body extending against
  // a curve and works at any speed. Anything steeper than `pumpAt` is a transition.
  const steep = 1 - n.y;

  // THE EDGES BITE ACROSS THE WHEELS. Not a hard lock: letting a little through is the
  // difference between carving and running on a rail.
  lat = decay(lat, SK.grip, dt);

  // anything: the `along` she keeps is along where she is NOW pointing.
  surfaceFrame(n, p.heading);
  p.vel.set(0, 0, 0).addScaledVector(_F, along).addScaledVector(_R, lat);
  // GRAVITY'S COMPONENT ALONG THE SURFACE: G - (G.n)n, with G = (0,-g,0).
  p.vel.x += SK.g * n.y * n.x * dt;

  // `stick` is how far the surface may fall away under her in this step before she is in the
  // air, and it is DERIVED: the tangent to a curve of radius R leaves it by `l^2 / 2R` over a
  // step of `l`, so that is exactly the amount a surface she is genuinely tracking can drop.
  // Off the lip of a kicker the gap is a metre and she goes. The ballistic term on top is what
  // makes a fast launch leave cleanly instead of being sucked back down.
  const g2 = groundAt(p.pos.x, p.pos.z, Math.max(y0, p.pos.y), SK.step);
  if (!g2.hit) { leaveGround(AIR.coyote); return; }
  const drop = p.pos.y - g2.floor;
  const hold = SK.stick0 + step * step / (2 * SK.stickR);
  if (drop > hold + Math.max(0, -p.vel.y) * dt) { leaveGround(AIR.coyote); return; }
  _N.set(g2.nx, g2.ny, g2.nz);
  // OVER A CONVEX CREASE SHE FLIES. Checked BEFORE the snap and before the projection, because
  // both of those are what would quietly eat the climb she is leaving on.
  if (p.vel.dot(_N) > SK.leave) { leaveGround(AIR.coyote); return; }
  p.pos.y = g2.floor;
  const bend = Math.acos(clamp(_N.dot(n), -1, 1));
  const sp0 = p.vel.length();
  p.vel.addScaledVector(_N, -p.vel.dot(_N));
  const sp1 = p.vel.length();
  // A SMOOTH TRANSITION COSTS NOTHING AND AN IMPACT COSTS THE COMPONENT INTO THE FACE. Riding
  // up a curve is a few degrees of bend per frame and must not be taxed, or a half pipe eats
  // your speed a sliver at a time and nothing ever gets to the coping.
  if (bend < SK.smoothAng && sp1 > 1e-4) p.vel.multiplyScalar(sp0 / sp1);
  n.copy(_N);
}

function stepAir(dt) {

// A FLIP ON THE RIGHT STICK'S FLICK, IN THE AIR. *"Flick up is a front flip, flick down a back flip,

// small jump is short and quick, and one flicked at the top of a big air takes its time. Too

// ---------- camera ----------
const cam = { az: 0, steerAz: 0, el: CAM.el, dist: CAM.dist, idle: 9, rush: 0,
              pos: new THREE.Vector3(), tgt: new THREE.Vector3() };
// WALKED, NOT RAYCAST, AND COARSE ON PURPOSE. The whole world is a triangle grid, so a dozen
// lookups beat any ray structure -- and a lens clipping a coping for an instant is not the
// failure a lens INSIDE a ramp is.
function camBlocked(x, y, z) {
  const g = groundAt(x, z, y, 12);
  // r45: and never inside a building -- the floors only know about a roof within 12 m of the lens
  return (g.hit && g.floor > y - CAM.clear) || !!solidAt(x, y, z, 0.3);
}
function camFree(tx, ty, tz, dx, dy, dz, want) {
  const step = 0.55, n = Math.ceil(want / step);
  for (let i = 1; i <= n; i++) {
    const d = Math.min(want, i * step);
    if (!camBlocked(tx + dx * d, ty + dy * d, tz + dz * d)) continue;
    let lo = d - step, hi = d;
    // BISECT. A quantised probe only ever takes values `step` apart, so the boom jumps half a
    // metre at a time as the shot sways past a wall -- fine for a yes/no, wrong the moment
    // something continuous is drawn from it.
    for (let k = 0; k < 4; k++) {
      const m = (lo + hi) * 0.5;
      if (camBlocked(tx + dx * m, ty + dy * m, tz + dz * m)) hi = m; else lo = m;
    }
    return Math.max(CAM.min, lo);
  }
  return want;
}
function stepCam(dt) {
  const p = player;
  // THE RIGHT PAD ORBITS IN A CIRCLE AND NOTHING ELSE. `cam.el` is a constant: there is no
  // pitch on this stick, by design -- a skating camera that can be pointed at the sky is a
  // camera you spend the whole session putting back.
  const rx = stick.R.x;
  const yaw = Math.abs(rx) > 0.05 ? -rx * CAM.yawRate * dt : 0;
  if (yaw) { cam.az += yaw; cam.idle = 0; } else cam.idle += dt;
  if (!stick.L.down) cam.steerAz = cam.az;          // no left thumb: the frames agree (see stickWorld)
  // AND THEN IT COMES BACK BEHIND HER. A skater goes where she points, so the lens wants to be
  // behind her and letting go of the pad should not leave you looking at her side. In the AIR
  // it nearly lets go: if the camera chases a spin, the lens comes round with her and nothing
  // appears to have happened except that you are dizzy.
  const sp = p.speed, hs = p.hSpeed;
  // r42: *"when you turn, the whole camera just turns every single time -- I want her to turn and then the
  // camera compensates, a nice ease."* A first-order follow starts swinging at full rate the instant she
  // turns, so the lens moves WITH her. `CAM.spring` 1 is a critically damped spring on the bearing instead:
  // it starts from rest and builds, so she visibly turns first and the shot comes round after her, and it
  // never overshoots. `follow` is the spring's natural frequency.
  if (cam.idle > CAM.idle && hs > 0.8) {
    const want = hs > 1.4 ? Math.atan2(p.vel.x, p.vel.z) : p.faceH;
    const rate = (p.grounded ? CAM.follow : CAM.followAir) * clamp(hs / 5, 0.3, 1.4);
    const err = wrapAngle(want - cam.az);
    let d;
    if (CAM.spring > 0.5) { cam.azV = (cam.azV || 0) + (rate * rate * err - 2 * rate * (cam.azV || 0)) * dt; d = cam.azV * dt; }
    else { d = err * Math.min(1, rate * dt); cam.azV = 0; }
    cam.az += d; cam.steerAz += d;
  } else cam.azV = decay(cam.azV || 0, 8, dt);
  cam.tgt.set(p.pos.x, p.pos.y + CAM.look, p.pos.z);
  const ce = Math.cos(cam.el);
  const bx = -Math.sin(cam.az) * ce, by = Math.sin(cam.el), bz = -Math.cos(cam.az) * ce;
  const want = clamp(CAM.dist + sp * CAM.distV, CAM.min, CAM.max);
  const free = camFree(cam.tgt.x, cam.tgt.y, cam.tgt.z, bx, by, bz, want);
  // SNAP IN, EASE OUT. Coming in has to be immediate or the lens spends those frames inside
  // the ramp; going back out is eased, or every coping makes the shot lurch.
  cam.dist = free < (cam.dist || want) ? free : damp(cam.dist || want, free, CAM.outHL, dt);
  const wx = cam.tgt.x + bx * cam.dist, wy = cam.tgt.y + by * cam.dist, wz = cam.tgt.z + bz * cam.dist;
  if (cam.pos.lengthSq() === 0) cam.pos.set(wx, wy, wz);
  cam.pos.x = damp(cam.pos.x, wx, CAM.half, dt);
  cam.pos.y = damp(cam.pos.y, wy, CAM.half, dt);
  cam.pos.z = damp(cam.pos.z, wz, CAM.half, dt);
  const cg = groundAt(cam.pos.x, cam.pos.z, cam.pos.y, 1.2);
  if (cg.hit && cam.pos.y < cg.floor + CAM.clear)
    cam.pos.y = Math.min(cg.floor + CAM.clear, cam.tgt.y + CAM.rise);
  camera.position.copy(cam.pos); camera.lookAt(cam.tgt);
  cam.rush = damp(cam.rush, clamp((sp - CAM.rush0) / CAM.rushSpan, 0, 1), 0.25, dt);
  camera.fov = CAM.fov + cam.rush * CAM.fovRush; camera.updateProjectionMatrix();

  sun.position.copy(p.pos).addScaledVector(LIGHT.dir, 60); sun.target.position.copy(p.pos);
  stepLights(cam.tgt, cam.az);
}

  ['HYD.breakV',     'Hydrant breaks at m/s', 1, 20, 0.5, ''],
  ['GEY.vmax',       'Geyser lift m/s', 4, 24, 0.5, ''],
  ['GEY.h',          'Geyser column height', 2, 16, 0.5, ''],
  ['GEM.r',          'Gem pickup reach', 0.5, 3, 0.05, ''],
  ['Grinding', ''],
  ['GRIND.catchR',   'Rail catch reach', 0.2, 1.5, 0.05, ''],
  ['GRIND.drag',     'Rail drag',      0,   2,   0.05, ''],
  ['GRIND.minV',     'Rail min speed', 0,   12,  0.5,  ''],
  ['GRIND.swap',     'Swap L/R clips', 0,   1,   1,    ''],
];
// A ROW NAMES ITS VALUE BY PATH, so one table drives dials on any of the live objects. `89` on the
// vert lock is OFF in practice: no wall in the park is steeper than 88 degrees.
const UIOBJ = { TAIL, LAND, MOVES, VERT, AIR, GRIND, SK, FLIPP, RIG, CAM, LOOK, FOOTIK, TRAIL, MELEE, SOLID, RAILX, HYD, GEY, GEM };
const uiRef = path => { const a = path.split('.'); let o = UIOBJ[a[0]];
  for (let i = 1; i < a.length - 1; i++) o = o[a[i]]; return [o, a[a.length - 1]]; };
const uiGet = path => { const [o, k] = uiRef(path); return o[k]; };
const uiSet = (path, v) => { const [o, k] = uiRef(path); o[k] = v; };
const TAILKEYS = TAILUI.filter(r => r.length > 2).map(r => r[0]);
// THE SHIPPED VALUES OF EVERY ROW, captured before `tailLoad` applies anything saved
const UI_DEF = {}; for (const k of TAILKEYS) UI_DEF[k] = uiGet(k);
function tailSave() {
  try { const o = { mode: TAIL.mode, lookStyle: LOOK.at === undefined ? LOOK.style : LOOK.at };
    for (const k of TAILKEYS) o[k] = uiGet(k); localStorage.setItem('rg.tail', JSON.stringify(o)); } catch (e) {}
}
function tailLoad() {
  try {
    const o = JSON.parse(localStorage.getItem('rg.tail') || 'null'); if (!o) return;
    if (o.mode === 'wave' || o.mode === 'sim') TAIL.mode = o.mode;
    // r35: THE LOOK DIALS BELONG TO THE LOOK THEY WERE SET UNDER. The panel saves every row, so a phone
    // that ever touched a slider in r34 holds Robits' exposure 1.15 and sky 1.0 -- applied to weirdport's
    // sky they are not its look at all. Saved under another style (or before styles), they are skipped;
    // and the style itself has its own key (`rg.style`), so it is never read from here.
    const lookOk = o.lookStyle === LOOK.style;
    for (const k of TAILKEYS) {
      if (k === 'LOOK.style' || (k.startsWith('LOOK.') && !lookOk)) continue;
      // r20 saved bare tail keys (`sway`); r21 saves paths (`TAIL.sway`). Both are read.
      const v = k in o ? o[k] : (k.startsWith('TAIL.') ? o[k.slice(5)] : undefined);
      if (typeof v === 'number' && Number.isFinite(v)) uiSet(k, v);
    }
  } catch (e) {}
}
const tailP = document.getElementById('tailP');
const fmt = v => (Math.abs(v) >= 10 || Number.isInteger(v)) ? String(Math.round(v * 10) / 10) : v.toFixed(2);
function tailPanel() {
  while (tailP.children.length) tailP.removeChild(tailP.children[0]);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const modes = el('div', 'btns');
  for (const m of ['wave', 'sim']) {
    const b = el('button', TAIL.mode === m ? 'sel' : '', m === 'wave' ? 'WAVE (visualizer)' : 'PHYSICS');
    b.addEventListener('click', () => { TAIL.mode = m; tailSave(); tailPanel(); });
    modes.appendChild(b);
  }
  tailP.appendChild(modes);
  for (const r of TAILUI) {
    if (r.length === 2) { if (r[1] && r[1] !== TAIL.mode) continue; tailP.appendChild(el('h3', '', r[0].toUpperCase())); continue; }
    const [k, label, lo, hi, step, mode, unit] = r;
    if (mode && mode !== TAIL.mode) continue;
    const D = unit === 'deg' ? 180 / Math.PI : 1;
    const row = el('div', 'row'), trk = el('div', 'trk'), fill = el('div', 'fill'), val = el('div', 'val');
    row.appendChild(el('div', 'lab', label)); trk.appendChild(fill); row.appendChild(trk); row.appendChild(val);
    const show = () => { const v = uiGet(k) * D; fill.style.width = (clamp((v - lo) / (hi - lo), 0, 1) * 100) + '%'; val.textContent = fmt(v); };
    const set = e => {
      const b = trk.getBoundingClientRect(), u = clamp((e.clientX - b.left) / Math.max(1, b.width), 0, 1);
      uiSet(k, clamp(Math.round((lo + u * (hi - lo)) / step) * step, lo, hi) / D);
      show();
    };
    let held = null;
    trk.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); held = e.pointerId;
      try { trk.setPointerCapture(e.pointerId); } catch (_) {} set(e); });
    trk.addEventListener('pointermove', e => { if (e.pointerId === held) set(e); });
    const up = e => { if (e.pointerId !== held) return; held = null; tailSave(); };
    trk.addEventListener('pointerup', up); trk.addEventListener('pointercancel', up);
    show();
    tailP.appendChild(row);
  }
  const foot = el('div', 'btns');
  const rst = el('button', '', 'RESET');
  rst.addEventListener('click', () => { TAIL.mode = TAIL_DEF.mode; for (const k of TAILKEYS) uiSet(k, UI_DEF[k]); tailSave(); tailPanel(); });
  const off = el('button', TAIL.on ? '' : 'sel', TAIL.on ? 'TAIL ON' : 'TAIL OFF');
  off.addEventListener('click', () => { TAIL.on = TAIL.on ? 0 : 1; tailPanel(); });
  const cls = el('button', '', 'CLOSE');
  cls.addEventListener('click', () => tailP.classList.remove('on'));
  foot.appendChild(rst); foot.appendChild(off); foot.appendChild(cls);
  tailP.appendChild(foot);
}
// a touch on the panel is never a stick, a camera drag or a jump
tailP.addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('tailB').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (tailP.classList.contains('on')) tailP.classList.remove('on');
  else { tailPanel(); tailP.classList.add('on'); }
});
tailLoad();

// ---------- boot ----------
// EVERY STEP IS NAMED, AND ONE STEP CANNOT KILL THE WHOLE BOOT. A throw anywhere in here used
// to take the card down with it and leave a game that is unreachable over a feature it does
// not need to be playable. The CITY and the GIRL are the two there is no game without.
async function init() {
  setBoot('building the park', 0.05);
  buildPark();
  // HIS PICK FIRST, THEN ANY OF THEM. A missing or half-downloaded file is one character, not
  // an empty street -- which matters most here, where one of the two is a test export that
  // may well be replaced in place while he is looking at it.
  let want = 0;
  try { const k = localStorage.getItem('rg.char'); const j = CHARS.findIndex(c => c.key === k); if (j >= 0) want = j; } catch (e) {}
  const order = [want]; for (let i = 0; i < CHARS.length; i++) if (i !== want) order.push(i);
  let got = null;
  for (const i of order) {
    setBoot('loading ' + CHARS[i].name, 0.15);
    try {
      got = await wearChar(i, e => { if (e && e.total) setBoot(null, 0.15 + 0.7 * clamp(e.loaded / e.total, 0, 1)); });
      if (got) break;
    } catch (e) { console.warn('[boot] ' + CHARS[i].file + ' did not arrive', e); }
  }
  if (!got && window.__crash) window.__crash('no character loaded\n' + CHARS.map(c => c.file).join('\n'));
  setBoot('drop in', 1);
  respawn();
  hudGutter(); resize();
  ready = true;
  // r45: the city's pictures come down AFTER she is skating -- the boxes and the collider are already up
  kitLoad(); hydLoad(); levelImports();
  document.getElementById('boot').classList.add('gone');
  setTimeout(() => { const b = document.getElementById('boot'); if (b && b.parentNode) b.parentNode.removeChild(b); }, 700);
}

// THE CONSOLE HANDLE. Every tunable is live: `rg.SK.grip = 3` and she skids.
window.rg = { SK, AIR, CAM, RIG, ANIM, TAIL, CHARS, TRI, LIGHT, player, girl, cam, scene, renderer, camera,
  groundAt, respawn, BUILD, PARK, normaliseClips, groundQ, leaveGround, stepPlayer, stepCam, girlAnim, stick, keys, stickWorld, SPAWN, BOWL,
  clipCyclic, trackSwing, clipRoles, tailFind, tailStep, tailWave, capDist, wearChar, TAIL_DEF, tailPanel, tailLoad,
  mirrorClip, mirrorName, buildMoves, MOVES, FACEFIX, flickFlip, setStance, enterGrind, bodyYaw, airPivot, hipHeight, centreOffset, swingOf, leanWant, FLIPP, flipShape, flipTurn, flipQ, isOnce, LAND, startFlip, landStance, girlAnimMoves, prepClips, VERT, UI_DEF, uiGet,
  CITY, SOLID, kitFrom, hydFrom, solidAdd, solidBuild, solidAt, solidPush, building, KIT, LEVEL, levelIngest, obbOf, HYD, GEY, hydBreak, GEM, PATHS, railPath, railLine, RAILX, goSpot, stepCity, camBlocked,
  grindSwitch, grindTrick, RAILS, RAIL_DEF, GRIND, railCatch, stepGrind, grindLeave, SPARK, swivel, railHome, hipLeanApply, hipLeanUndo, grabStep, bodyG, MELEE, meleeStrike, meleeSlide, kickTarget, stepMelee, rightFlick, flickWorld, FOOTIK, legIK, footFind, TRAIL, trailBuild, trailAmount,
  char(k) { const i = CHARS.findIndex(c => c.key === k); return wearChar(i < 0 ? charI + 1 : i, null); },
  ready: () => ready,
  tp(x, z) { player.pos.set(x, 40, z); player.vel.set(0, 0, 0); player.grounded = false; },
  bowl() { this.tp(BOWL.x, BOWL.z + BOWL.r - 1); },
  pipe() { this.tp(0, 30); },
};

resize();
frame();
init();
</script>
